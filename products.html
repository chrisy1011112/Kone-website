<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kone - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0e14] text-gray-300 antialiased min-h-screen flex">

  <aside class="w-64 bg-[#0d111a] border-r border-slate-800/60 flex flex-col justify-between shrink-0 h-screen sticky top-0">
    <div>
      <div class="px-6 py-5 flex items-center gap-2">
        <span class="text-white text-2xl font-bold tracking-tight">Kone</span>
      </div>

      <nav class="px-3 space-y-6">
        <div>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-slate-800/60 text-white font-medium text-sm transition-colors">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            Products
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-slate-800/30 font-medium text-sm transition-colors mt-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            Transfers
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-slate-800/30 font-medium text-sm transition-colors mt-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            Premium
          </a>
        </div>

        <div>
          <div class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Management</div>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-900/20 text-blue-400 font-medium text-sm transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            Support
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-slate-800/30 font-medium text-sm transition-colors mt-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Settings
          </a>
        </div>

        <div>
          <div class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Resources</div>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-slate-800/30 font-medium text-sm transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            Documentation
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-slate-800/30 font-medium text-sm transition-colors mt-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
            Discord Server
          </a>
        </div>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-800/60 flex items-center gap-3">
      <img src="https://cdn.discordapp.com/avatars/1189951070160568441/d7efed9cfd3bc395a64eb93dcf6ece11.png" class="w-8 h-8 rounded-full bg-slate-800" alt="Avatar">
      <span class="text-sm font-semibold text-white truncate">chrisy101112_40700</span>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    
    <header class="h-16 border-b border-slate-800/60 px-8 flex items-center justify-between sticky top-0 bg-[#0b0e14]/90 backdrop-blur z-10">
      <div class="flex items-center gap-2">
        <h1 class="text-white font-semibold text-sm">Products</h1>
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
      </div>

      <div class="flex items-center gap-4">
        <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-indigo-900/30 border border-indigo-500/30 text-indigo-300 text-xs font-semibold">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
          0 pts
        </button>
        <div class="flex items-center gap-2">
          <img src="https://cdn.discordapp.com/avatars/1189951070160568441/d7efed9cfd3bc395a64eb93dcf6ece11.png" class="w-7 h-7 rounded-full bg-slate-800" alt="Avatar">
          <span class="text-sm font-medium text-white">chrisy101112_40700</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </header>

    <main class="p-8">
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl">
        </div>
    </main>

  </div>

  <script>
    // EDIT PRODUCT CARDS HERE
    const products = [
      {
        name: "Kone Nametag",
        image: "https://cdn.discordapp.com/attachments/1530902854359842847/1530902854733140220/7C6F7A4B-7EEC-4868-9AA5-6CC16F504E78.png?ex=6a6ddb63&is=6a6c89e3&hm=002b49b4e935c8f1f48f56b4004f3ce4a62aecbe492068b26bc27cdf7b15470b&",
        downloadUrl: "#",
        editUrl: null,
        hasDropdown: false
      },
      {
        name: "Kone Restaurant",
        image: "https://cdn.discordapp.com/attachments/1530130014333435944/1530130014513926254/2F78FDDA-263A-4890-B93E-C27691408C41.png?ex=6a6e575f&is=6a6d05df&hm=4a54ad715a1ed412ce9d989a5fa4711834037992d60109878af3e40932f20f65&",
        downloadUrl: "#",
        editUrl: null,
        hasDropdown: false
      }
    ];

    const grid = document.getElementById("product-grid");

    products.forEach(item => {
      let buttonGroupHtml = '';

      if (item.downloadUrl && item.editUrl) {
        buttonGroupHtml = `
          <div class="flex items-center gap-2 mt-4">
            <a href="${item.downloadUrl}" download class="flex-1 py-2 bg-[#00b060] hover:bg-[#009b54] text-white font-medium text-sm rounded-lg text-center transition-colors">Download</a>
            <a href="${item.editUrl}" class="px-5 py-2 bg-[#2d3748]/50 hover:bg-[#2d3748] text-white font-medium text-sm rounded-lg text-center transition-colors">Edit</a>
          </div>
        `;
      } else if (item.downloadUrl) {
        buttonGroupHtml = `
          <div class="flex items-center mt-4">
            <a href="${item.downloadUrl}" download class="w-full py-2 bg-[#00b060] hover:bg-[#009b54] text-white font-medium text-sm rounded-lg text-center transition-colors flex items-center justify-center gap-1">
              Download
              ${item.hasDropdown ? '<svg class="w-4 h-4 ml-1 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>' : ''}
            </a>
          </div>
        `;
      } else if (item.editUrl) {
        buttonGroupHtml = `
          <div class="flex items-center mt-4">
            <a href="${item.editUrl}" class="w-full py-2 bg-[#2d3748]/60 hover:bg-[#2d3748] text-white font-medium text-sm rounded-lg text-center transition-colors">Edit</a>
          </div>
        `;
      }

      grid.innerHTML += `
        <div class="bg-[#121824] border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700/80 transition-all">
          <div>
            <div class="h-36 w-full rounded-xl overflow-hidden bg-[#0a0d14] flex items-center justify-center">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
            </div>
            <h3 class="text-white text-base font-semibold text-center mt-4">${item.name}</h3>
          </div>
          ${buttonGroupHtml}
        </div>
      `;
    });

    // Append Banner Card at the end
    grid.innerHTML += `
      <div class="border border-dashed border-slate-700/60 rounded-2xl p-6 flex flex-col items-center justify-center text-center bg-transparent">
        <div class="w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400 mb-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        </div>
        <h3 class="text-white font-bold text-sm mb-2">Curious for more?</h3>
        <p class="text-xs text-gray-400 leading-relaxed max-w-[200px]">Click on any product card to explore its full features, read documentation, and watch a video demo!</p>
      </div>
    `;
  </script>

</body>
</html>
