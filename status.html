<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status - Kone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html">Kone</a>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="status.html" class="active">Status</a>
    </div>
    <div class="user-profile">
      <div class="avatar-placeholder">U</div>
      <span>User</span>
      <span class="status-dot"></span>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>System Status</h1>
      <p class="subtitle">Real-time status metrics for all Kone services.</p>
    </div>

    <div class="status-banner operational">
      <span class="banner-icon">✔</span> All Systems Operational
    </div>

    <div class="status-list">
      
      <div class="status-item">
        <div class="service-info">
          <strong>API Gateway</strong>
          <span class="ping">18ms latency</span>
        </div>
        <span class="badge online">Operational</span>
      </div>

      <div class="status-item">
        <div class="service-info">
          <strong>Bot Dispatcher</strong>
          <span class="ping">24ms latency</span>
        </div>
        <span class="badge online">Operational</span>
      </div>

      <div class="status-item">
        <div class="service-info">
          <strong>Database Clusters</strong>
          <span class="ping">12ms latency</span>
        </div>
        <span class="badge online">Operational</span>
      </div>

      <div class="status-item">
        <div class="service-info">
          <strong>Webhook Delivery</strong>
          <span class="ping">31ms latency</span>
        </div>
        <span class="badge maintenance">Maintenance</span>
      </div>

    </div>
  </div>

</body>
</html>
